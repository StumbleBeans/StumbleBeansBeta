<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Stumble Beans</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1033; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #elim {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: none; pointer-events: none; text-align: center; z-index: 10;
    background: #e8232b;
    border-top: 8px solid #1b1b1b; border-bottom: 8px solid #1b1b1b;
    box-shadow: 0 0 0 6px #ff6b6b inset;
    padding: 14px 0;
  }
  #elim span {
    display: inline-block; font-family: 'Arial Black', 'Impact', system-ui, sans-serif;
    font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    font-size: clamp(34px, 8vw, 100px); color: #fff;
    -webkit-text-stroke: 14px #1b1b1b; paint-order: stroke fill;
    text-shadow: none;
  }
  #elim.show { display: block; animation: elimBand .25s ease-out; }
  #elim.show span { animation: elimPop .7s cubic-bezier(.2,1.6,.4,1), elimShake .5s .7s ease-in-out 2; }
  @keyframes elimBand { from { opacity: 0; transform: translateY(-50%) scaleY(0); } to { opacity: 1; transform: translateY(-50%) scaleY(1); } }
  @keyframes elimPop { 0% { transform: scale(4) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-3deg); } }
  @keyframes elimShake { 0%,100% { transform: rotate(-3deg) scale(1); } 25% { transform: rotate(2deg) scale(1.06); } 75% { transform: rotate(-5deg) scale(1.06); } }

  /* ---------- Sterowanie dotykowe ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  body.phone #touch { display: block; }
  body.elimd #touch { display: none; }
  #joy, #jumpBtn {
    position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%;
    background: rgba(255,255,255,.28); border: 7px solid #1b1b1b; box-sizing: border-box;
    box-shadow: 0 0 0 5px rgba(255,255,255,.85) inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #joy { left: 5vmin; bottom: 8vmin; width: clamp(130px, 32vmin, 220px); height: clamp(130px, 32vmin, 220px); }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
    background: #fff; border: 8px solid #1b1b1b; box-sizing: border-box; box-shadow: 0 5px 0 rgba(0,0,0,.35); pointer-events: none;
  }
  #jumpBtn { right: 6vmin; bottom: 10vmin; width: clamp(110px, 28vmin, 190px); height: clamp(110px, 28vmin, 190px); transition: transform .08s; }
  #jumpBtn.down { transform: scale(.9); background: rgba(255,255,255,.5); }
  #jumpBtn svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #jumpBtn path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #jumpBtn .o { stroke: #1b1b1b; stroke-width: 22; }
  #jumpBtn .i { stroke: #fff; stroke-width: 11; }
  /* ---------- Menu główne ---------- */
  #menu { position: fixed; inset: 0; display: none; z-index: 8; pointer-events: none; }
  body.menu #menu { display: block; }
  body.menu #touch { display: none; }
  #playBtn {
    position: absolute; right: 5vmin; bottom: 6vmin; pointer-events: auto; cursor: pointer;
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
    font-size: clamp(30px, 7vmin, 64px); color: #fff; -webkit-text-stroke: 10px #1b1b1b; paint-order: stroke fill;
    background: #ffd21f; border: 8px solid #1b1b1b; border-radius: 18px; padding: 10px 44px;
    box-shadow: 0 0 0 5px #fff18a inset, 0 8px 0 rgba(0,0,0,.35);
    transition: transform .08s; touch-action: manipulation;
  }
  #playBtn:hover { background: #ffe14d; }
  #playBtn:active { transform: scale(.92); }

  /* ---------- Nick nad fasolką ---------- */
  #nameplate {
    position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; white-space: nowrap; transform: translate(-9999px, -9999px);
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: 26px; color: #fff; -webkit-text-stroke: 7px #1b1b1b; will-change: transform; paint-order: stroke fill;
  }
  body.profile #nameplate, body.elimd #nameplate { display: none !important; }

  /* ---------- Profilowe (lewy górny róg menu) ---------- */
  #profileBtn {
    position: absolute; left: 3vmin; top: 3vmin; pointer-events: auto; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; gap: 12px; padding: 0; background: none; border: 0; transition: transform .08s;
  }
  #profileBtn:hover { transform: scale(1.05); }
  #profileBtn:active { transform: scale(.93); }
  .avatar {
    position: relative; border-radius: 50%; box-sizing: border-box; overflow: hidden; flex: none;
    background: #0b1033; isolation: isolate;
    box-shadow: 0 6px 0 rgba(0,0,0,.35);
  }
  /* obrys rysowany NA wierzchu canvasa, żeby przy hoverze/skalowaniu nic spod niego nie prześwitywało */
  .avatar::after {
    content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 9px solid #1b1b1b; box-sizing: border-box;
    box-shadow: 0 0 0 4px #fff inset; pointer-events: none; z-index: 2;
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  #profileBtn .avatar { width: clamp(64px, 14vmin, 110px); height: clamp(64px, 14vmin, 110px); }
  #profileName {
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: clamp(16px, 3.4vmin, 30px); color: #fff; -webkit-text-stroke: 7px #1b1b1b; paint-order: stroke fill;
    max-width: 40vw; overflow: visible; white-space: nowrap; padding: 6px 10px 6px 4px;   /* overflow:hidden ucinał obrys litery B z lewej */
  }

  body.profile #menu { display: none; }
  /* ---------- Ekran profilu (3D fasolka + niebo w tle) ---------- */
  #profile {
    position: fixed; inset: 0; z-index: 9; display: none; overflow: hidden; pointer-events: none;
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  body.profile #profile { display: block; }
  .pbtn {
    pointer-events: auto; cursor: pointer; touch-action: manipulation; font-family: inherit; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    color: #fff; -webkit-text-stroke: 8px #1b1b1b; paint-order: stroke fill;
    border: 7px solid #1b1b1b; border-radius: 16px; transition: transform .08s;
  }
  .pbtn:active { transform: scale(.92); }
  #saveBtn { font-size: clamp(18px, 4vmin, 34px); padding: 6px 26px; background: #2bbf4b; box-shadow: 0 0 0 4px #7dff9a inset, 0 7px 0 rgba(0,0,0,.35); }
  #saveBtn:hover { background: #3ad65c; }
  #backBtn {
    position: absolute; left: 3vmin; top: 3vmin; padding: 0; border-radius: 50%; box-sizing: border-box;
    width: clamp(56px, 12vmin, 92px); height: clamp(56px, 12vmin, 92px);
    background: #e8232b; box-shadow: 0 0 0 5px #ff6b6b inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #backBtn:hover { background: #ff3b43; }
  #backBtn svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #backBtn path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #backBtn .o { stroke: #1b1b1b; stroke-width: 22; }
  #backBtn .i { stroke: #fff; stroke-width: 11; }
  #pwrap {
    position: absolute; right: 3vw; top: 0; bottom: 0; width: 52vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
  }
  body.profile #pwrap { animation: pIn .55s .45s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  @media (max-aspect-ratio: 1/1) {
    #pwrap { left: 0; right: 0; top: auto; bottom: 5vh; width: auto; }
  }
  #nickRow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #nickInput {
    pointer-events: auto; font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: clamp(18px, 4vmin, 34px); color: #1b1b1b; text-align: center; width: clamp(180px, 40vmin, 320px);
    background: #fff; border: 7px solid #1b1b1b; border-radius: 16px; padding: 6px 12px; box-sizing: border-box;
    box-shadow: 0 0 0 4px #d8d8ff inset, 0 7px 0 rgba(0,0,0,.35); outline: none;
  }
  #nickInput:focus, #nickInput:active, #nickInput:-webkit-autofill { background: #fff; -webkit-box-shadow: 0 0 0 4px #d8d8ff inset, 0 7px 0 rgba(0,0,0,.35), 0 0 0 100px #fff inset; }
  #stats { display: flex; gap: 2.5vmin; flex-wrap: wrap; justify-content: center; }
  .stat {
    min-width: clamp(100px, 22vmin, 180px); text-align: center; padding: 8px 14px 12px; box-sizing: border-box;
    background: #e8232b; border: 7px solid #1b1b1b; border-radius: 16px; color: #fff;
    box-shadow: 0 0 0 4px #ff6b6b inset, 0 7px 0 rgba(0,0,0,.35);
  }
  .stat.w { background: #2bbf4b; box-shadow: 0 0 0 4px #7dff9a inset, 0 7px 0 rgba(0,0,0,.35); }
  .stat.r { background: #3a7bff; box-shadow: 0 0 0 4px #8fb4ff inset, 0 7px 0 rgba(0,0,0,.35); }
  .stat .l { font-size: clamp(12px, 2.6vmin, 22px); letter-spacing: 2px; -webkit-text-stroke: 6px #1b1b1b; paint-order: stroke fill; }
  .stat .v { font-size: clamp(28px, 7vmin, 60px); -webkit-text-stroke: 9px #1b1b1b; paint-order: stroke fill; }

  /* gładkie obrysy tekstu: zaokrąglone łączenia zamiast ostrych "kolców" w literach */
  #elim span, #playBtn, #nameplate, #profileName, .stat .l, .stat .v, #profile, #profile * {
    stroke-linejoin: round; stroke-linecap: round; text-rendering: geometricPrecision;
  }
</style>
</head>
<body class="menu">
<div id="elim"><span>ELIMINATED!</span></div>
<div id="menu">
  <button id="profileBtn" title="Profile"><div class="avatar"></div><span id="profileName"></span></button>
  <button id="playBtn">PLAY</button>
</div>
<div id="nameplate"></div>
<div id="profile">
  <button id="backBtn" class="pbtn" title="Back"><svg viewBox="0 0 64 64"><path class="o" d="M40 12 L20 32 L40 52"/><path class="i" d="M40 12 L20 32 L40 52"/></svg></button>
  <div id="pwrap">
    <div id="nickRow">
      <input id="nickInput" type="text" maxlength="14" spellcheck="false" autocomplete="off" placeholder="Nickname">
      <button id="saveBtn" class="pbtn">Save</button>
    </div>
    <div id="stats">
      <div class="stat w"><div class="l">Wins</div><div class="v" id="stWins">0</div></div>
      <div class="stat"><div class="l">Loses</div><div class="v" id="stLoses">0</div></div>
      <div class="stat r"><div class="l">Win Rate</div><div class="v" id="stRate">0%</div></div>
    </div>
  </div>
</div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="jumpBtn"><svg viewBox="0 0 64 64"><path class="o" d="M12 42 L32 20 L52 42"/><path class="i" d="M12 42 L32 20 L52 42"/></svg></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Scena ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1033);
scene.fog = new THREE.Fog(0x0b1033, 60, 160);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xaab8ff, 0x445577, 0.75));
const sun = new THREE.DirectionalLight(0xdde4ff, 0.7);

// ---------- Gwiazdy ----------
const stars = (function makeStars() {
  const N = 1600, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * Math.PI * 2;
    const v = Math.random() * 2 - 1;                 // cała sfera (góra i dół)
    const r = 220, s = Math.sqrt(1 - v * v);
    arr[i * 3]     = Math.cos(u) * s * r;
    arr[i * 3 + 1] = v * r;
    arr[i * 3 + 2] = Math.sin(u) * s * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const m = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.9, depthWrite: false });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return p;
})();
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;   sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 120;
scene.add(sun); scene.add(sun.target);

// ---------- Podłoga ----------
const FLOOR_HALF = 40;
(function makeFloor() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#b07cff'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#8a4fe0'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(FLOOR_HALF, FLOOR_HALF);
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(FLOOR_HALF * 2, 2, FLOOR_HALF * 2),
    [0,1,2,3,4,5].map(i => new THREE.MeshStandardMaterial(i === 2 ? { map: tex } : { color: 0x5a2a9a }))
  );
  floor.position.y = -1;
  floor.receiveShadow = true;
  scene.add(floor);
})();

// ---------- Fasolka ----------
const RADIUS = 0.6, STRETCH = 1.3;
const HALF_H = RADIUS * STRETCH;           // połowa wysokości fasolki
const bean = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, 32, 24),
  new THREE.MeshStandardMaterial({ color: 0xe8453c, roughness: 0.45 })
);
body.scale.set(1, STRETCH, 0.9);
body.castShadow = true;
bean.add(body);
scene.add(bean);

// ---------- Stan gry ----------
const pos = new THREE.Vector3(0, HALF_H, 0);
const vel = new THREE.Vector3();
let grounded = true, coyote = 0, jumpBuffer = 0;
let yaw = 0, pitch = 0.35, facing = 0;
let diveCooldown = 0, diving = false, diveTimer = 0, groundH = HALF_H;
let squash = 0, tilt = new THREE.Vector2();

const MAX_SPEED = 9, ACCEL = 55, FRICTION = 40, AIR_CONTROL = 0.45;
const GRAVITY = 32, JUMP_V = 12, DIVE_SPEED = 15, DIVE_TIME = 0.85, DIVE_HEIGHT = 0.55, DIVE_COOLDOWN = 1.5, FALL_LIMIT = -60;  // jak głęboko trzeba spaść, żeby się odrodzić

// ---------- Sterowanie ----------
const keys = {};
let lastSpace = -1, diveBuffer = 0;
let inMenu = true;
camera.position.set(0, 1.9, 5.2);
function startGame() {
  if (!inMenu || profileOpen) return;
  pvT = 0;
  inMenu = false; document.body.classList.remove('menu');
  facing = 0; yaw = 0; pitch = 0.35; tilt.set(0, 0); squash = 0;
}
let phone = false;
const joy = { x: 0, y: 0, id: null };

function pressJump() {
  if (inMenu) return;
  const now = performance.now() / 1000;
  if (now - lastSpace < 0.5) { diveBuffer = 0.35; lastSpace = -1; }   // podwójny skok = dive
  else { jumpBuffer = 0.12; lastSpace = now; }
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;   // pisanie nicku
  if (e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space') pressJump();
});
addEventListener('keyup', e => keys[e.code] = false);
document.getElementById('playBtn').addEventListener('click', startGame);
addEventListener('keydown', e => { if (inMenu && !profileOpen && e.target.tagName !== 'INPUT' && e.code === 'Enter') startGame(); });

const cv = renderer.domElement;
cv.style.touchAction = 'none';
cv.addEventListener('click', () => { if (!phone && !inMenu) cv.requestPointerLock(); });
addEventListener('mousemove', e => {
  if (!document.pointerLockElement) return;
  yaw   -= e.movementX * 0.0025;
  pitch += e.movementY * 0.0025;
  pitch = Math.max(-0.2, Math.min(1.2, pitch));
});

// ---------- Telefon: kamera (przeciąganie), joystick, skok ----------
let camId = null, camX = 0, camY = 0;
cv.addEventListener('pointerdown', e => {
  if (!phone || camId !== null) return;
  camId = e.pointerId; camX = e.clientX; camY = e.clientY; cv.setPointerCapture(camId);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== camId) return;
  yaw   -= (e.clientX - camX) * 0.006;
  pitch += (e.clientY - camY) * 0.006;
  pitch = Math.max(-0.2, Math.min(1.2, pitch));
  camX = e.clientX; camY = e.clientY;
});
const camEnd = e => { if (e.pointerId === camId) camId = null; };
cv.addEventListener('pointerup', camEnd); cv.addEventListener('pointercancel', camEnd);

const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
function joyMove(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const len = Math.hypot(dx, dy);
  if (len > R) { dx *= R / len; dy *= R / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / R; joy.y = -dy / R;
}
function joyReset() { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; }
joyEl.addEventListener('pointerdown', e => { if (joy.id !== null) return; joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
joyEl.addEventListener('pointerup', e => { if (e.pointerId === joy.id) joyReset(); });
joyEl.addEventListener('pointercancel', e => { if (e.pointerId === joy.id) joyReset(); });

const jumpEl = document.getElementById('jumpBtn');
jumpEl.addEventListener('pointerdown', e => { e.preventDefault(); jumpEl.classList.add('down'); pressJump(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => jumpEl.addEventListener(t, () => jumpEl.classList.remove('down')));
document.addEventListener('contextmenu', e => { if (phone) e.preventDefault(); });

// ---------- Wykrywanie PC / telefon ----------
function setMode(m) {
  phone = m === 'phone';
  document.body.classList.toggle('phone', phone);
  if (phone && document.pointerLockElement) document.exitPointerLock();
  joyReset(); camId = null;
}
setMode(matchMedia('(pointer: coarse)').matches ? 'phone' : 'pc');

// ---------- Profil gracza ----------
let profileOpen = false, pvT = 0;
let playerNick = 'Bean';
try { const n = localStorage.getItem('stumbleBeansNick'); if (n) playerNick = n.slice(0, 14); } catch (err) {}
const stats = { wins: 0, losses: 0 };   // na razie testowe - nic się nie zalicza

// Profilowe w menu = prawdziwa fasolka 3D (osobny mały renderer w kółku)
const avEl = document.querySelector('#profileBtn .avatar');
const avRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
avRenderer.setClearColor(0x000000, 0);
avRenderer.domElement.style.cssText = 'display:block;width:100%;height:100%';
avEl.appendChild(avRenderer.domElement);
const avScene = new THREE.Scene();
avScene.background = new THREE.Color(0x0b1033);          // to samo tło co w grze
avScene.add(new THREE.HemisphereLight(0xaab8ff, 0x445577, 0.9));
const avSun = new THREE.DirectionalLight(0xdde4ff, 0.8); avSun.position.set(2, 4, 3);
avSun.castShadow = true; avSun.shadow.mapSize.set(512, 512);
avSun.shadow.camera.left = -3; avSun.shadow.camera.right = 3; avSun.shadow.camera.top = 3; avSun.shadow.camera.bottom = -3;
avSun.shadow.camera.near = 1; avSun.shadow.camera.far = 15;
avScene.add(avSun);
avRenderer.shadowMap.enabled = true; avRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
(function () {   // gwiazdy
  const N = 300, arr = new Float32Array(N * 3);
  for (let k = 0; k < N; k++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * 2 - 1, r = 40, sr = Math.sqrt(1 - v * v);
    arr[k * 3] = Math.cos(u) * sr * r; arr[k * 3 + 1] = v * r; arr[k * 3 + 2] = Math.sin(u) * sr * r;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  avScene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0.9, depthWrite: false })));
})();
(function () {   // podłoga (ta sama co w grze), fasolka na niej stoi
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#b07cff'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#8a4fe0'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 8);
  const fl = new THREE.Mesh(
    new THREE.BoxGeometry(16, 2, 16),
    [0,1,2,3,4,5].map(k => new THREE.MeshStandardMaterial(k === 2 ? { map: tex } : { color: 0x5a2a9a }))
  );
  fl.position.y = -HALF_H - 1; fl.receiveShadow = true; avScene.add(fl);
})();
const avBean = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, 32, 24),
  new THREE.MeshStandardMaterial({ color: 0xe8453c, roughness: 0.45 })
);
avBean.scale.set(1, STRETCH, 0.9); avBean.castShadow = true; avScene.add(avBean);
const avCam = new THREE.PerspectiveCamera(30, 1, 0.1, 80);
avCam.position.set(0, 0.5, 3.9); avCam.lookAt(0, 0.3, 0);   // fasolka mniejsza, cała widoczna w kółku
let avSize = 0;
function renderAvatar() {
  if (!inMenu || profileOpen) return;
  const w = avEl.clientWidth; if (!w) return;
  if (w !== avSize) { avSize = w; avRenderer.setPixelRatio(Math.min(devicePixelRatio, 2)); avRenderer.setSize(w, w, false); }
  avBean.rotation.y = 0;   // profilowe się nie kręci
  avRenderer.render(avScene, avCam);
}

const nameplateEl = document.getElementById('nameplate');
const profileNameEl = document.getElementById('profileName');
const nickInput = document.getElementById('nickInput');
function applyNick() {
  nameplateEl.textContent = playerNick;
  profileNameEl.textContent = playerNick;
}
function renderStats() {
  const total = stats.wins + stats.losses;
  document.getElementById('stWins').textContent = stats.wins;
  document.getElementById('stLoses').textContent = stats.losses;
  document.getElementById('stRate').textContent = (total ? Math.round(stats.wins / total * 100) : 0) + '%';
}
function openProfile() {
  if (!inMenu) return;
  profileOpen = true; document.body.classList.add('profile');
  nickInput.value = playerNick; renderStats();
}
function closeProfile() {
  profileOpen = false; document.body.classList.remove('profile'); nickInput.blur();
}
function saveNick() {
  const n = nickInput.value.trim().slice(0, 14);
  if (n) { playerNick = n; try { localStorage.setItem('stumbleBeansNick', n); } catch (err) {} applyNick(); }
  nickInput.value = playerNick; nickInput.blur();
}
document.getElementById('profileBtn').addEventListener('click', openProfile);
document.getElementById('backBtn').addEventListener('click', closeProfile);
document.getElementById('saveBtn').addEventListener('click', saveNick);
nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveNick(); });
addEventListener('keydown', e => { if (e.code === 'Escape' && profileOpen) closeProfile(); });
applyNick(); renderStats();

// nick unosi się nad fasolką (w menu i w grze)
const _np = new THREE.Vector3();
function updateNameplate() {
  if ((eliminated && !inMenu) || profileOpen) { nameplateEl.style.display = 'none'; return; }
  camera.updateMatrixWorld();
  _np.set(bean.position.x, bean.position.y + HALF_H, bean.position.z).project(camera);
  if (_np.z > 1 || _np.z < -1) { nameplateEl.style.display = 'none'; return; }
  nameplateEl.style.display = '';
  nameplateEl.style.transform = `translate(${(_np.x * 0.5 + 0.5) * innerWidth}px, ${(-_np.y * 0.5 + 0.5) * innerHeight - 14}px) translate(-50%, -100%)`;   // stały rozmiar i stały odstęp w px, niezależnie od oddalenia kamery
}
const _mPos = new THREE.Vector3(0, 1.9, 5.2), _mLook = new THREE.Vector3(0, 1.1, 0);
const _pPos = new THREE.Vector3(), _pLook = new THREE.Vector3(), _dPos = new THREE.Vector3(), _dLook = new THREE.Vector3();
const menuLook = new THREE.Vector3(0, 1.1, 0);

// ---------- Pętla ----------
const clock = new THREE.Clock();
function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * Math.min(t, 1);
}

const elimEl = document.getElementById('elim');
let eliminated = false, elimTimer = 0;
const ELIM_TIME = 2.0;
function respawn() {   // po eliminacji wracamy do menu głównego
  pos.set(0, HALF_H, 0); vel.set(0, 0, 0); diving = false; grounded = true;
  groundH = HALF_H; diveBuffer = 0; jumpBuffer = 0; yaw = 0; facing = 0; pitch = 0.35;
  tilt.set(0, 0); squash = 0;
  eliminated = false; elimEl.classList.remove('show');
  document.body.classList.remove('elimd');
  inMenu = true; document.body.classList.add('menu');
  camera.position.set(0, 1.9, 5.2); pvT = 0;
  if (document.pointerLockElement) document.exitPointerLock();   // oddaj kursor, żeby kliknąć PLAY
}

function update(dt) {
  if (inMenu) {   // menu główne: fasolka kręci się na środku
    facing += dt * 0.9;
    const br = Math.sin(performance.now() / 500) * 0.04;
    bean.position.set(0, HALF_H, 0);
    bean.rotation.set(0, facing, 0, 'YXZ');
    body.scale.set(1 - br * 0.5, STRETCH * (1 + br), 0.9 - br * 0.5);
    // przejście do profilu: kamera jedzie w górę, tło zmienia się w niebo
    pvT = Math.max(0, Math.min(1, pvT + (profileOpen ? 1 : -1) * dt / 1.1));
    const pv = pvT * pvT * (3 - 2 * pvT);
    const asp = innerWidth / innerHeight, portrait = asp < 1;
    const pd = 5.4, halfH = pd * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), halfW = halfH * asp;
    const sx = portrait ? 0 : halfW * 0.42;
    const ty = portrait ? HALF_H - halfH * 0.42 : 2.0;
    _pPos.set(sx, 1.6, pd); _pLook.set(sx, ty, 0);
    const swoop = Math.sin(pv * Math.PI) * 1.5;
    _dPos.lerpVectors(_mPos, _pPos, pv); _dPos.y += swoop;
    _dLook.lerpVectors(_mLook, _pLook, pv); _dLook.y += swoop * 0.7;
    camera.position.lerp(_dPos, Math.min(1, dt * 10));
    menuLook.lerp(_dLook, Math.min(1, dt * 10));
    camera.lookAt(menuLook);
    stars.position.copy(camera.position);
    sun.position.set(30, 50, 20); sun.target.position.set(0, 0, 0);
    return;
  }
  if (eliminated) {
    elimTimer -= dt;
    if (elimTimer <= 0) respawn();
    return;
  }
  // kamera strzałkami (opcjonalnie)
  if (keys.ArrowLeft)  yaw += 2.2 * dt;
  if (keys.ArrowRight) yaw -= 2.2 * dt;
  if (keys.ArrowUp)    pitch = Math.max(-0.2, pitch - 1.5 * dt);
  if (keys.ArrowDown)  pitch = Math.min(1.2, pitch + 1.5 * dt);

  // kierunek względem kamery
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  ix += joy.x; iz += joy.y;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const wish = new THREE.Vector3().addScaledVector(fwd, iz).addScaledVector(right, ix);
  const hasInput = wish.lengthSq() > 0.04;   // martwa strefa joysticka
  if (hasInput) wish.normalize();

  // dive
  diveCooldown -= dt;
  diveBuffer -= dt;
  if (diveBuffer > 0 && diveCooldown <= 0) {
    diveBuffer = 0;
    {
    diveCooldown = DIVE_COOLDOWN;
    diving = true; diveTimer = DIVE_TIME; jumpBuffer = 0;
    vel.x = Math.sin(facing) * DIVE_SPEED;
    vel.z = Math.cos(facing) * DIVE_SPEED;
    vel.y = grounded ? 6 : Math.min(vel.y, 2);
    grounded = false;
    }
  }
  if (diving) {
    diveTimer -= dt;
    if (grounded) {   // ślizg po ziemi
      const sp = Math.hypot(vel.x, vel.z);
      const drop = Math.min(sp, 14 * dt);
      if (sp > 0) { vel.x -= vel.x / sp * drop; vel.z -= vel.z / sp * drop; }
    }
    if (diveTimer <= 0) diving = false;
  }

  // przyspieszanie / tarcie
  const control = grounded ? 1 : AIR_CONTROL;
  if (diving) {
    // brak sterowania podczas dive'a
  } else if (hasInput) {
    vel.x += wish.x * ACCEL * control * dt;
    vel.z += wish.z * ACCEL * control * dt;
    facing = angleLerp(facing, Math.atan2(wish.x, wish.z), dt * 14);
  } else if (grounded) {
    const sp = Math.hypot(vel.x, vel.z);
    const drop = Math.min(sp, FRICTION * dt);
    if (sp > 0) { vel.x -= vel.x / sp * drop; vel.z -= vel.z / sp * drop; }
  }
  const hs = Math.hypot(vel.x, vel.z);
  const maxSp = diving ? DIVE_SPEED : MAX_SPEED;
  if (hs > maxSp) { vel.x *= maxSp / hs; vel.z *= maxSp / hs; }

  // skok (z buforem i coyote time)
  jumpBuffer -= dt;
  coyote = grounded ? 0.1 : coyote - dt;
  if (!diving && jumpBuffer > 0 && coyote > 0) {
    vel.y = JUMP_V; grounded = false; coyote = 0; jumpBuffer = 0; squash = -0.25;
  }

  // grawitacja
  vel.y -= GRAVITY * dt;
  const prevY = pos.y;
  pos.addScaledVector(vel, dt);

  // lądowanie na podłodze
  groundH += ((diving ? DIVE_HEIGHT : HALF_H) - groundH) * Math.min(1, dt * 12);

  // ściany boczne podłogi: nie da się wejść "w bok" w klocek podłogi
  // (tylko gdy środek fasolki jest POZA obrysem podłogi - nigdy nie teleportuje z podłogi na krawędź)
  if (pos.y < groundH - 0.05 && pos.y > -2 - HALF_H) {
    const lim = FLOOR_HALF + RADIUS;
    const outX = Math.abs(pos.x) >= FLOOR_HALF, outZ = Math.abs(pos.z) >= FLOOR_HALF;
    if ((outX || outZ) && Math.abs(pos.x) < lim && Math.abs(pos.z) < lim) {
      const px = outX ? lim - Math.abs(pos.x) : Infinity;
      const pz = outZ ? lim - Math.abs(pos.z) : Infinity;
      if (px <= pz) { pos.x = Math.sign(pos.x || 1) * lim; if (vel.x * pos.x > 0) vel.x = 0; }
      else          { pos.z = Math.sign(pos.z || 1) * lim; if (vel.z * pos.z > 0) vel.z = 0; }
    }
  }
  const onFloor = Math.abs(pos.x) < FLOOR_HALF && Math.abs(pos.z) < FLOOR_HALF;
  // lądowanie tylko gdy fasolka przyszła Z GÓRY (nigdy nie wyrzuca w górę z boku podłogi)
  if (onFloor && pos.y <= groundH && vel.y <= 0 && prevY >= DIVE_HEIGHT - 0.1) {
    if (!grounded && vel.y < -6) squash = Math.min(0.35, -vel.y * 0.02);
    pos.y = groundH; vel.y = 0; grounded = true;
  } else if (pos.y > groundH + 0.01 || !onFloor) {
    grounded = false;
  }

  // respawn po spadnięciu
  if (pos.y < FALL_LIMIT) {
    eliminated = true; elimTimer = ELIM_TIME;
    document.body.classList.add('elimd');      // schowaj guziki
    joyReset(); camId = null; jumpEl.classList.remove('down');
    elimEl.classList.remove('show'); void elimEl.offsetWidth; elimEl.classList.add('show');
  }

  // wygląd: pochylenie w stronę ruchu + ściskanie
  const lean = Math.min(hs / MAX_SPEED, 1) * 0.35;
  const localVx = vel.x * Math.cos(facing) - vel.z * Math.sin(facing);
  tilt.x += ((diving ? 1.45 : (hs > 0.1 ? lean : 0)) - tilt.x) * Math.min(1, dt * 14);
  tilt.y += (-localVx * 0.02 - tilt.y) * Math.min(1, dt * 8);
  squash += (0 - squash) * Math.min(1, dt * 12);
  const stretchAir = grounded ? 0 : Math.max(-0.1, Math.min(0.15, vel.y * 0.01));

  bean.position.copy(pos);
  bean.rotation.set(tilt.x, facing, tilt.y, 'YXZ');
  body.scale.set(1 + squash * 0.6 - stretchAir * 0.3, STRETCH * (1 - squash + stretchAir), 0.9 + squash * 0.6);

  // kamera trzecioosobowa
  const dist = 8;
  const target = new THREE.Vector3(pos.x, pos.y + 1.2, pos.z);
  const camPos = new THREE.Vector3(
    target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  camPos.y = Math.max(camPos.y, 0.5);
  camera.position.lerp(camPos, Math.min(1, dt * 12));
  camera.lookAt(target);

  // gwiazdy zawsze wokół kamery (nieskończenie daleko)
  stars.position.copy(camera.position);

  // cień podąża za graczem
  sun.position.set(pos.x + 30, 50, pos.z + 20);
  sun.target.position.set(pos.x, 0, pos.z);
}

// Gra działa też w tle: gdy karta jest ukryta przeglądarka zatrzymuje requestAnimationFrame,
// więc wtedy symulację popycha timer z Web Workera (nie jest tak dławiony jak zwykły setInterval).
let lastT = performance.now();
function advance() {
  const now = performance.now();
  let rem = Math.min((now - lastT) / 1000, 60);
  lastT = now;
  while (rem > 0) { const d = Math.min(rem, 0.05); update(d); rem -= d; }   // małe kroki = ta sama fizyka
}
function loop() {
  requestAnimationFrame(loop);
  advance();
  renderer.render(scene, camera);
  updateNameplate();
  renderAvatar();
}
loop();
(function backgroundTicker() {
  const tick = () => { if (document.hidden) advance(); };
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),50)'], { type: 'text/javascript' })));
    w.onmessage = tick;
  } catch (err) { setInterval(tick, 250); }
})();
// po zmianie okna nie zostawiaj "wciśniętych" klawiszy (keyup nie dociera do ukrytej karty)
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
